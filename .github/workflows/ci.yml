name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR → bump to latest CMS release, push commit to the PR branch if anything changed.
  # GITHUB_TOKEN push triggers no new run → `site` tests the bumped commit in this run instead
  # (its check stays on the previous head SHA). Fork PRs: no push rights, skipped.
  bump:
    name: Bump CMS to latest release
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # also runs pnpm install (lockfile) + check-version
      - name: Bump CMS
        run: pnpm bump-cms

      - name: Commit & push
        id: commit
        run: |
          if git diff --quiet; then
            echo "Already on the latest CMS release"
            exit 0
          fi
          version=$(sed -n 's/^ARG CMS_VERSION=//p' Dockerfile)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(dep): bump CMS to v$version"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::Bumped CMS to v$version, read the release notes: https://github.com/trainpaths/cms/releases/tag/v$version"

  site:
    name: Lint / typecheck / build / smoke e2e
    needs: bump
    # bump skipped on push / fork PRs
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CMS package and API image versions match
        run: pnpm check-version

      - name: Lint
        run: pnpm lint

      - name: Build (vue-tsc + client + SSR)
        run: pnpm build

      # throwaway secrets for the test stack
      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^API_JWT_KEY=.*|API_JWT_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^S3_SECRET_KEY=.*|S3_SECRET_KEY=$(openssl rand -hex 32)|" .env

      - name: Build & start stack
        run: docker compose up -d --build

      - name: Wait for frontend
        run: timeout 180 bash -c 'until curl -sf http://localhost:5173/; do sleep 5; done'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down
