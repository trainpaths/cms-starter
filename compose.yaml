# The site: postgres + seaweedfs + api (CMS image + cms.config.json) + renderer + frontend, built from ./Dockerfile.
# Credentials come from .env.
# Production file: `docker compose -f compose.yaml …` or COMPOSE_FILE=compose.yaml in .env (skips compose.override.yaml,
# which publishes the api port for `pnpm dev`).
# Networks: postgres + seaweedfs sit on `backend` (internal: no egress, unreachable from renderer/frontend); the api
# bridges both. Only frontend publishes a port, on 127.0.0.1: a reverse proxy on the host serves the site
# (published ports bypass ufw, so never bind 0.0.0.0).
# Every service: no-new-privileges + all capabilities dropped; processes run as non-root users (api 1654, renderer
# node, frontend nginx 101, postgres 70, seaweedfs 1000), cap_add only for the root steps that need it.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # entrypoint runs as root only to fix data-dir ownership, then drops to its user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Media blob store (S3 API on :8333). Not published to the host: only the api talks to it.
  # -ip.bind=0.0.0.0 = all interfaces of this container, i.e. the backend network only (127.0.0.1 would cut off the api).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # entrypoint runs as root only to fix data-dir ownership, then drops to its user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command: server -s3 -ip.bind=0.0.0.0
    environment:
      # creates the admin S3 identity; anonymous requests are denied
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (openssl rand -hex 32)}
    volumes:
      - seaweed-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build:
      target: api
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # no published port: nginx reaches api:8080 on the compose network (dev port: compose.override.yaml)
    # default: renderer, frontend, SMTP egress
    networks: [backend, default]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      Jwt__SigningKey: ${API_JWT_KEY:?Set API_JWT_KEY in .env (openssl rand -base64 48)}
      Jwt__Issuer: ${API_JWT_ISSUER:-cms}
      Jwt__Audience: ${API_JWT_AUDIENCE:-cms-clients}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:5173}
      RateLimiting__PermitLimit: ${RATE_LIMIT_PERMIT:-10}
      RateLimiting__General__PermitLimit: ${RATE_LIMIT_GENERAL_PERMIT:-120}
      RateLimiting__Pages__PermitLimit: ${RATE_LIMIT_PAGES_PERMIT:-600}
      # trust X-Forwarded-For from nginx on the compose network
      ForwardedHeaders__KnownNetworks: ${FORWARDED_KNOWN_NETWORKS:-172.16.0.0/12}
      Auth__SecureCookie: ${AUTH_SECURE_COOKIE:-true}
      Bootstrap__SuperAdminEmail: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      Bootstrap__SuperAdminPassword: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER}
      Email__Password: ${SMTP_PASSWORD}
      Email__From: ${EMAIL_FROM:-no-reply@example.com}
      Email__FromName: ${EMAIL_FROM_NAME:-Website}
      Email__LinkBaseUrl: ${APP_BASE_URL:-http://localhost:5173}
      Storage__S3__ServiceUrl: http://seaweedfs:8333
      Storage__S3__AccessKey: ${S3_ACCESS_KEY}
      Storage__S3__SecretKey: ${S3_SECRET_KEY}
      Storage__S3__Bucket: ${S3_BUCKET:-media}
      Renderer__BaseUrl: http://renderer:8080
      Renderer__PublicBaseUrl: ${APP_BASE_URL:-http://localhost:5173}
      # shown in the admin's Backups tab (the API can't see the host side of its mount)
      Backup__HostPath: ${BACKUP_DIR:-./backups}
    volumes:
      # backup archives on the host (owner set by backups-init)
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      backups-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "api-backend.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Docker creates a missing bind folder as root; the api runs as uid 1654 (.NET image `app` user).
  backups-init:
    image: busybox:1.37
    command: chown 1654:1654 /backups
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    network_mode: none
  # Renders public pages to HTML for the api (POST /render). Not published: only the api talks to it.
  renderer:
    build:
      target: renderer
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      target: frontend
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  seaweed-data:

networks:
  backend:
    internal: true
